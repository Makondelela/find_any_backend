# Scheduled/Manual Job Scraping
# ==============================
# Runs scrapers on GitHub Actions (supports Playwright)
# Can be triggered manually or on schedule

name: Scrape Jobs

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      search_terms:
        description: 'Comma-separated search terms'
        type: string
        required: false
        default: 'Data Engineer, Data Analyst, Data Scientist, Data Architect, Business Intelligence, BI Developer, Machine Learning Engineer, Analytics Engineer, ETL Developer, Data Warehouse Developer, Data Quality Analyst, Data Governance Specialist, Business Analyst, Software Developer, Developer, Software Engineer, Programmer, Software Tester, software'
      sources:
        description: 'Which scrapers to run (comma-separated)'
        type: string
        required: false
        default: 'all'

concurrency:
  group: scrape-jobs
  cancel-in-progress: true

permissions:
  contents: write  # To commit updated data files

env:
  PYTHON_VERSION: '3.11'

jobs:
  scrape:
    name: Scrape and Update Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Configure environment
        run: |
          echo "FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}" >> $GITHUB_ENV
          echo "FIREBASE_CONFIG=${{ secrets.FIREBASE_CONFIG }}" >> $GITHUB_ENV
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> $GITHUB_ENV
          echo "FLASK_SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }}" >> $GITHUB_ENV

      - name: Run scrapers
        id: scrape
        run: |
          # Build search terms
          SEARCH_TERMS="${{ github.event.inputs.search_terms || env.DEFAULT_SEARCH_TERMS }}"

          # Build scraper flags
          SCRAPER_FLAGS=""
          SOURCES="${{ github.event.inputs.sources || 'all' }}"
          if [ "$SOURCES" != "all" ]; then
            for src in $(echo $SOURCES | tr ',' ' '); do
              SCRAPER_FLAGS="$SCRAPER_FLAGS --$src"
            done
          fi

          echo "Running scrapers with search: $SEARCH_TERMS"
          echo "Scraper flags: $SCRAPER_FLAGS"

          # Run the main scraper
          python backend/main.py --json --search "$SEARCH_TERMS" $SCRAPER_FLAGS

      - name: Combine results
        run: |
          python combine_jobs.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet data/; then
            echo "No changes to commit"
            exit 0
          fi

          git add data/
          git commit -m "🤖 Auto-update job data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "Scraping failed! Check GitHub Actions logs."
          # Could add Slack/Discord notification here