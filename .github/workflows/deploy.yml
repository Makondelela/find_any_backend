# Deploy FindFast to AWS Elastic Beanstalk
# =========================================
# Triggers on push to main or manual dispatch
# Deploys Python Flask app to Elastic Beanstalk

name: Deploy FindFast to Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: choice
        options:
          - findfast-env
        default: 'findfast-env'

concurrency:
  group: deploy-findfast
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # For OIDC if using AWS roles

env:
  AWS_REGION: eu-north-1
  EB_APPLICATION: findfast
  EB_ENVIRONMENT: findfast-env
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright is not needed on EB (scraping runs separately)
          # playwright install chromium

      - name: Run tests
        run: |
          python -m py_compile app.py
          python -m py_compile backend/job_service.py
          python -m py_compile combine_jobs.py
          # Add pytest if you have tests
          # pytest tests/

      - name: Create deployment package
        run: |
          # Create a clean deployment package
          mkdir -p deploy_package
          # Copy all necessary files
          cp -r app.py backend/ user_profile/ templates/ static/ deploy_package/
          cp requirements.txt runtime.txt deploy_package/
          cp combine_jobs.py deploy_package/
          cp trigger_scrape.py deploy_package/
          cp Procfile deploy_package/
          # Create .ebextensions for EB configuration
          mkdir -p deploy_package/.ebextensions
          cp .ebextensions/* deploy_package/.ebextensions/ 2>/dev/null || true
          # Verify key files exist
          ls -la deploy_package/
          ls -la deploy_package/.ebextensions/
          # Create zip
          cd deploy_package
          zip -r ../findfast-deploy.zip . -x "*.pyc" "__pycache__/*" "*.git*" "venv/*" ".env*" "data/*.json" "*.log"
          cd ..
          echo "Package size: $(du -h findfast-deploy.zip | cut -f1)"
          # Verify zip contents
          unzip -l findfast-deploy.zip | head -30

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create EB application version
        id: create-version
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          VERSION_LABEL="findfast-${TIMESTAMP}-${GITHUB_SHA::7}"

          echo "Creating version: ${VERSION_LABEL}"

          # Upload to EB's S3 bucket
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          KEY="${EB_APPLICATION}/${VERSION_LABEL}.zip"

          echo "Uploading to s3://${BUCKET}/${KEY}"
          aws s3 cp findfast-deploy.zip "s3://${BUCKET}/${KEY}"

          # Verify upload
          aws s3 ls "s3://${BUCKET}/${KEY}"

          # Check if version already exists (for re-runs of same commit)
          EXISTING=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${EB_APPLICATION}" \
            --version-labels "${VERSION_LABEL}" \
            --query 'length(ApplicationVersions)' --output text 2>/dev/null || echo "0")

          if [ "$EXISTING" != "0" ]; then
            echo "Version ${VERSION_LABEL} already exists, reusing it"
          else
            echo "Creating application version..."
            aws elasticbeanstalk create-application-version \
              --application-name "${EB_APPLICATION}" \
              --version-label "${VERSION_LABEL}" \
              --description "Deploy ${GITHUB_SHA::7}: $(git log -1 --format=%s | cut -c1-100)" \
              --source-bundle "S3Bucket=${BUCKET},S3Key=${KEY}"
          fi

          # Wait for version to be PROCESSED (critical - EB must process the zip before it can deploy)
          echo "Waiting for application version to be PROCESSED..."
          for i in {1..30}; do
            STATUS=$(aws elasticbeanstalk describe-application-versions \
              --application-name "${EB_APPLICATION}" \
              --version-labels "${VERSION_LABEL}" \
              --query 'ApplicationVersions[0].Status' --output text)
            echo "Attempt $i/30: Version status = ${STATUS}"
            if [ "${STATUS}" = "PROCESSED" ]; then
              echo "✓ Version is PROCESSED and ready for deployment"
              break
            fi
            if [ "${STATUS}" = "FAILED" ]; then
              echo "::error::Version processing FAILED"
              # Get failure reason
              aws elasticbeanstalk describe-application-versions \
                --application-name "${EB_APPLICATION}" \
                --version-labels "${VERSION_LABEL}" \
                --query 'ApplicationVersions[0].{Status:Status,Message:Message}' --output json
              exit 1
            fi
            sleep 10
          done

          # Final verification
          VERSION_CHECK=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${EB_APPLICATION}" \
            --version-labels "${VERSION_LABEL}" \
            --query 'ApplicationVersions[0].VersionLabel' --output text)

          echo "Version check result: '${VERSION_CHECK}'"

          if [ "${VERSION_CHECK}" != "${VERSION_LABEL}" ]; then
            echo "::error::Application version ${VERSION_LABEL} not found after creation"
            exit 1
          fi

          echo "✓ Application version verified and PROCESSED: ${VERSION_LABEL}"
          echo "version_label=${VERSION_LABEL}" >> $GITHUB_OUTPUT

      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION_LABEL="${{ steps.create-version.outputs.version_label }}"
          echo "Deploying version: ${VERSION_LABEL}"

          # Deploy the version
          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT}" \
            --version-label "${VERSION_LABEL}" \
            --query '[EnvironmentName,VersionLabel,Status]' --output text

          # Wait for deployment to complete
          echo "Waiting for environment update to complete..."
          aws elasticbeanstalk wait environment-updated --environment-names "${EB_ENVIRONMENT}"

          # Verify the environment is actually running the new version
          echo "Checking deployed version..."
          read -r DEPLOYED_VERSION HEALTH <<< "$(aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT}" \
            --query 'Environments[0].[VersionLabel,Health]' --output text)"

          echo "Environment is on version: ${DEPLOYED_VERSION}, health: ${HEALTH}"

          if [ "${DEPLOYED_VERSION}" != "${VERSION_LABEL}" ]; then
            echo "::error::The environment did not switch to ${VERSION_LABEL}; Beanstalk rolled back or the deploy failed. Check the environment's Events and logs."
            exit 1
          fi

          echo "✓ Version verified: ${DEPLOYED_VERSION}"

      - name: Verify deployment
        run: |
          # Get environment URL
          ENV_URL=$(aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT}" \
            --query 'Environments[0].CNAME' --output text)

          echo "Environment URL: https://${ENV_URL}"

          # Wait for app to be ready and test health endpoint
          for i in {1..15}; do
            if curl -fsS "https://${ENV_URL}/health" > /dev/null; then
              echo "✓ Health check passed!"
              exit 0
            fi
            echo "Waiting for app... (attempt $i/15)"
            sleep 10
          done

          echo "✗ Health check failed after 2.5 minutes"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check GitHub Actions logs for details."
